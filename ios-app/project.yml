name: ZPAssistant
options:
  bundleIdPrefix: com.zp
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "15.0"
packages:
  SocketIO:
    url: https://github.com/socketio/socket.io-client-swift
    exactVersion: 16.1.1
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  ZPAssistant:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - ZPAssistant
    dependencies:
      - package: SocketIO
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zp.assistant
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
    info:
      path: ZPAssistant/Info.plist
      properties:
        CFBundleDisplayName: ZP助手
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIBackgroundModes:
          - audio
        NSCameraUsageDescription: 需要相机扫描桌面端显示的连接二维码
        ITSAppUsesNonExemptEncryption: false
schemes:
  ZPAssistant:
    build:
      targets:
        ZPAssistant: all
    archive:
      config: Release
